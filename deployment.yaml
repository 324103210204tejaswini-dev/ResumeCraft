apiVersion: apps/v1
kind: Deployment

metadata:
  name: resumecraft-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: resumecraft

  template:
    metadata:
      labels:
        app: resumecraft

    spec:
      containers:
        - name: resumecraft
          image: resumecraft:1.0
          imagePullPolicy: Never

          ports:
            - containerPort: 9090